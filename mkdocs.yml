site_name: Vũ Trụ Truyện Tranh Việt Nam
site_description: >
  Vietnamese Comic Universe — 37 stories, 568 AI image prompts, and a
  multiverse of Vietnamese legends reimagined as superhero narratives.
site_author: captain-corgi
site_url: https://captain-corgi.github.io/ai-vn-comic/
repo_url: https://github.com/captain-corgi/ai-vn-comic
repo_name: captain-corgi/ai-vn-comic
edit_uri: edit/DevMaster/

# Stories, prompts and images live at the repo root; the `tools/build_docs.py`
# script stages them into `docs/` before `mkdocs build` runs.
docs_dir: docs

theme:
  name: material
  language: vi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Chuyển sang giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang giao diện sáng
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.share
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/captain-corgi/ai-vn-comic

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      # Vietnamese search with accent folding; Material's search plugin
      # already normalises diacritics via its unicode tokenizer.
      lang:
        - vi
        - en
      separator: '[\s\-\.]+'

